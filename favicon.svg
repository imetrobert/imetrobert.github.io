<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="AI Insights">
  <title>AI Insights</title>
  <!--
    Site-wide favicon: the "AI Insights" mark, used by the homepage and the
    blog alike. (It replaced an older RS monogram; that version is still in
    git history if it is ever wanted back.)

    This is the favicon cut of blog/logo.svg. Same lockup, stripped back so it
    survives at 16px: no neural texture, flat white ink instead of a gradient,
    heavier strokes, and the whole mark scaled up to sit tighter in the tile.
    Keep this in sync with blog/logo.svg by hand - they are deliberately
    separate files so the small size can be tuned without compromising the
    large one.
  -->
  <defs>
    <linearGradient id="favTile" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#2563eb"/>
      <stop offset="55%"  stop-color="#1a7fb5"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <path id="favLeafHalf" d="M 0 -100 L 34 -28 L 52 -40 L 50 -20 L 92 0 L 50 22 L 52 42 L 26 34 L 11 58 L 0 58 Z"/>
  </defs>

  <rect width="512" height="512" rx="112" fill="#ffffff"/>
  <rect x="10" y="10" width="492" height="492" rx="104" fill="url(#favTile)"/>

  <g transform="translate(256,256) scale(1.12) translate(-256,-256)">
    <g transform="translate(-32,39)">
      <g transform="translate(256,278) scale(0.9) translate(-256,-278)">
        <g transform="translate(32,16)" fill="none" stroke="#ffffff"
           stroke-linecap="round" stroke-linejoin="round">
          <path d="M118 372 L186 168 L254 372" stroke-width="52"/>
          <path d="M150 300 H222" stroke-width="44"/>
          <path d="M330 168 V372" stroke-width="52"/>
        </g>
      </g>
      <g transform="translate(372,106) scale(0.72)" fill="#ffffff">
        <use href="#favLeafHalf"/>
        <use href="#favLeafHalf" transform="scale(-1,1)"/>
      </g>
    </g>
  </g>
</svg>
