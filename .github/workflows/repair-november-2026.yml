name: Repair November 2026 Publish (Run Once)

# Puts the site back into the state the approve workflow would have left after the
# November issue was replaced by hand: share links, latest.html, sitemap, feed,
# llms.txt, redirect stubs, staging and model order. It checks its own work and
# commits nothing if any reference to a deleted page survives. Safe to run twice.

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: blog-pipeline
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt
          pip install beautifulsoup4 lxml

      - name: Repair
        run: python3 scripts/repair_november_2026.py 2>&1 | tee /tmp/repair_output.txt

      - name: Configure Git
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "Blog Publisher"

      - name: Commit and push
        run: |
          git add -A
          if git diff --staged --quiet; then
            echo "No changes - already repaired."
          else
            git commit -m "Repair November 2026 publish: share links, latest, sitemap, feed, stubs, model order"
            git push
          fi

      - name: Summary
        if: always()
        run: |
          echo "## November 2026 repair" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat /tmp/repair_output.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
