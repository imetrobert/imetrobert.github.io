name: Content gap suggestion (one guide worth adding)

# Monthly (the 4th, after the issue is published), and on demand. Suggests ONE guide worth adding to biz.aiwithrobert.com
# in ops/content-gap.json. It only suggests; nothing is published. See scripts/content_gap_report.py.
on:
  schedule:
    - cron: '23 14 4 * *'
  workflow_dispatch:

permissions:
  contents: write

# Same group as the rest of the pipeline: never overlaps a generation, so the shared Gemini request ledger is not raced.
concurrency:
  group: blog-pipeline
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt
          pip install beautifulsoup4 lxml
      - name: Suggest one guide
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python3 scripts/content_gap_report.py
      - name: Commit and push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "Content gap report"
          git add ops/
          if git diff --staged --quiet; then echo "No changes"; else
            git commit -m "Content gap report: monthly suggestion"
            bash scripts/git_push_retry.sh
          fi
